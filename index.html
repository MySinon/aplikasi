<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aplikasi — My Sinon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Orbitron:wght@500;900&family=Yuji+Syuku&display=swap" rel="stylesheet" />

<style>
/* =========================================================
   RESET & VARIABLES
   ========================================================= */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --sakura: #e8d8ff;
  --pink: #ec4899;
  --purple: #7c3aed;
  --maroon: #8b1e2d;
  --gold: #d4af37;
  --cyan: #06b6d4;
  --green: #4ade80;
  --yellow: #fbbf24;
  --bg-1: #120a1f;
  --text: #f5edff;
  --text-dim: #b8a8d0;
  --gradient: linear-gradient(135deg, #8b1e2d, #ec4899, #7c3aed);
  --gradient-warm: linear-gradient(135deg, #e8d8ff, #ec4899, #8b1e2d);
  --gradient-green: linear-gradient(135deg, #10b981, #4ade80, #06b6d4);
  --card-bg: rgba(30, 20, 45, 0.55);
  --card-border: rgba(139, 30, 45, 0.35);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Poppins', sans-serif;
  background: var(--bg-1);
  color: var(--text);
  overflow-x: hidden;
  min-height: 100vh;
  position: relative;
  padding-top: 70px;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 15% 20%, rgba(236, 72, 153, 0.2), transparent 45%),
    radial-gradient(circle at 85% 30%, rgba(124, 58, 237, 0.18), transparent 45%),
    radial-gradient(circle at 50% 90%, rgba(139, 30, 45, 0.12), transparent 50%);
  z-index: -3;
  animation: auroraShift 14s ease-in-out infinite alternate;
  pointer-events: none;
}
@keyframes auroraShift {
  0%   { transform: translate(0, 0) scale(1); filter: hue-rotate(0deg); }
  100% { transform: translate(-20px, -30px) scale(1.1); filter: hue-rotate(20deg); }
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(236, 72, 153, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(168, 85, 247, 0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  z-index: -2;
  pointer-events: none;
  mask-image: radial-gradient(circle at 50% 50%, black 30%, transparent 75%);
  -webkit-mask-image: radial-gradient(circle at 50% 50%, black 30%, transparent 75%);
}

#sakura {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  overflow: hidden;
}
.petal {
  position: absolute;
  top: -30px;
  width: 12px;
  height: 12px;
  background: radial-gradient(circle at 30% 30%, #ffd9e2, #ffb7c5);
  border-radius: 50% 0 50% 0;
  opacity: 0.6;
  will-change: transform;
  animation: petalFall linear infinite;
}
@keyframes petalFall {
  0%   { transform: translate(0, -30px) rotate(0deg); opacity: 0; }
  10%  { opacity: 0.6; }
  90%  { opacity: 0.6; }
  100% { transform: translate(var(--drift, 60px), 105vh) rotate(720deg); opacity: 0; }
}

/* =========================================================
   NAVBAR
   ========================================================= */
.navbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  padding: 16px 5vw;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 100;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  background: rgba(18, 10, 31, 0.7);
  border-bottom: 1px solid rgba(236, 72, 153, 0.15);
}
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--sakura);
  text-decoration: none;
  font-size: 0.9rem;
  font-weight: 500;
  padding: 8px 16px;
  border-radius: 50px;
  border: 1px solid rgba(236, 72, 153, 0.4);
  background: rgba(236, 72, 153, 0.08);
  transition: all 0.3s;
}
.back-btn:hover {
  background: rgba(236, 72, 153, 0.2);
  box-shadow: 0 0 20px rgba(236, 72, 153, 0.5);
  transform: translateX(-3px);
}
.back-btn svg {
  width: 14px;
  height: 14px;
}
.logo {
  font-family: 'Yuji Syuku', serif;
  font-weight: 700;
  font-size: 1.3rem;
  letter-spacing: 3px;
  color: var(--sakura);
  text-shadow: 0 0 15px var(--pink);
}
.logo span {
  background: var(--gradient-warm);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* =========================================================
   HERO
   ========================================================= */
.hero-page {
  padding: 60px 5vw 20px;
  text-align: center;
}
.hero-page .jp {
  font-family: 'Yuji Syuku', serif;
  color: var(--sakura);
  letter-spacing: 10px;
  font-size: 0.9rem;
  opacity: 0.7;
  margin-bottom: 12px;
  display: block;
  animation: fadeInUp 0.8s ease both;
}
.hero-page h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(2rem, 6vw, 3.5rem);
  font-weight: 900;
  letter-spacing: 2px;
  margin-bottom: 1rem;
  text-shadow: 0 0 30px rgba(236, 72, 153, 0.5);
  animation: fadeInUp 0.8s ease 0.15s both;
}
.hero-page h1 .gradient-text {
  background: linear-gradient(135deg, #e8d8ff, #ec4899, #8b1e2d, #ec4899, #e8d8ff);
  background-size: 300% 300%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: gradientShift 5s ease infinite;
}
@keyframes gradientShift {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
.hero-page p.desc {
  max-width: 620px;
  margin: 0 auto;
  color: var(--text-dim);
  font-size: 1rem;
  line-height: 1.7;
  animation: fadeInUp 0.8s ease 0.3s both;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* =========================================================
   FILTER BAR
   ========================================================= */
.filter-bar {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 24px 5vw;
  animation: fadeInUp 0.8s ease 0.45s both;
}
.filter-btn {
  padding: 8px 20px;
  border-radius: 50px;
  border: 1px solid rgba(236, 72, 153, 0.35);
  background: rgba(236, 72, 153, 0.08);
  color: var(--text-dim);
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s;
  letter-spacing: 0.5px;
}
.filter-btn:hover {
  border-color: var(--pink);
  color: var(--sakura);
  transform: translateY(-2px);
  box-shadow: 0 0 15px rgba(236, 72, 153, 0.3);
}
.filter-btn.active {
  background: var(--gradient);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 0 25px rgba(236, 72, 153, 0.6);
  font-weight: 700;
}

/* =========================================================
   APP GRID
   ========================================================= */
.apps-wrap {
  padding: 20px 5vw 100px;
  max-width: 1180px;
  margin: 0 auto;
}
.apps-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 22px;
}

.app-card {
  position: relative;
  padding: 22px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 20px;
  cursor: pointer;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  overflow: hidden;
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
              border-color 0.35s, box-shadow 0.35s;
  opacity: 0;
  animation: cardReveal 0.6s ease forwards;
}
@keyframes cardReveal {
  from { opacity: 0; transform: translateY(30px); }
  to   { opacity: 1; transform: translateY(0); }
}
.app-card:hover {
  transform: translateY(-6px);
  border-color: rgba(236, 72, 153, 0.7);
  box-shadow: 0 20px 50px rgba(236, 72, 153, 0.3),
              0 0 60px rgba(124, 58, 237, 0.2);
}
.app-card.is-live {
  border-color: rgba(74, 222, 128, 0.4);
}
.app-card.is-live:hover {
  border-color: rgba(74, 222, 128, 0.8);
  box-shadow: 0 20px 50px rgba(74, 222, 128, 0.3),
              0 0 60px rgba(6, 182, 212, 0.25);
}

/* Preview: single image */
.app-preview {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 14px;
  overflow: hidden;
  background: linear-gradient(135deg, #1a0f2e, #2a1a45);
  border: 1px solid rgba(236, 72, 153, 0.3);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.8rem;
}
.app-preview::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(45deg,
      rgba(168, 85, 247, 0.06) 0 12px,
      rgba(236, 72, 153, 0.06) 12px 24px);
  z-index: 1;
}
.app-preview img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  z-index: 2;
}
.app-preview .preview-emoji {
  position: relative;
  z-index: 2;
  filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.5));
}

/* Locked state on card preview */
.app-card.is-locked .app-preview img,
.app-card.is-locked .app-preview .preview-emoji {
  filter: blur(10px) brightness(0.4) saturate(1.3);
  transform: scale(1.1);
  transition: filter 0.4s;
}
.preview-lock {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 3;
  font-size: 2.2rem;
  filter: drop-shadow(0 0 18px var(--gold));
  pointer-events: none;
}

.app-info {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 12px;
}
.app-icon-big {
  width: 56px;
  height: 56px;
  border-radius: 14px;
  background: var(--gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8rem;
  flex-shrink: 0;
  box-shadow: 0 4px 20px rgba(236, 72, 153, 0.5),
              inset 0 -3px 0 rgba(0,0,0,0.2);
}
.app-card.is-live .app-icon-big {
  background: var(--gradient-green);
  box-shadow: 0 4px 20px rgba(74, 222, 128, 0.5),
              inset 0 -3px 0 rgba(0,0,0,0.2);
}
.app-name {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: 0.5px;
  margin-bottom: 3px;
  line-height: 1.3;
}
.app-dev {
  font-size: 0.75rem;
  color: var(--text-dim);
  letter-spacing: 0.3px;
}

.app-short {
  color: var(--text-dim);
  font-size: 0.85rem;
  line-height: 1.55;
  margin-bottom: 14px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.app-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.app-status-badge {
  padding: 4px 12px;
  border-radius: 50px;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.5px;
  display: inline-flex;
  align-items: center;
}
.app-status-badge.stable {
  background: rgba(74, 222, 128, 0.15);
  border: 1px solid rgba(74, 222, 128, 0.5);
  color: var(--green);
}
.app-status-badge.beta {
  background: rgba(6, 182, 212, 0.15);
  border: 1px solid rgba(6, 182, 212, 0.5);
  color: var(--cyan);
}
.app-status-badge.soon {
  background: rgba(168, 85, 247, 0.15);
  border: 1px solid rgba(168, 85, 247, 0.5);
  color: #d8b4fe;
}

.app-cta {
  padding: 6px 16px;
  border-radius: 50px;
  background: rgba(236, 72, 153, 0.15);
  border: 1px solid rgba(236, 72, 153, 0.5);
  color: var(--sakura);
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.5px;
  transition: all 0.3s;
}
.app-card:hover .app-cta {
  background: var(--gradient);
  border-color: transparent;
  color: #fff;
  box-shadow: 0 0 20px rgba(236, 72, 153, 0.7);
}
.app-card.is-live .app-cta {
  background: rgba(74, 222, 128, 0.15);
  border-color: rgba(74, 222, 128, 0.6);
  color: var(--green);
}
.app-card.is-live:hover .app-cta {
  background: var(--gradient-green);
  border-color: transparent;
  color: #062a1a;
  box-shadow: 0 0 20px rgba(74, 222, 128, 0.8);
}

/* =========================================================
   MODAL
   ========================================================= */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 5, 20, 0.9);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 1000;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.35s, visibility 0.35s;
}
.modal-overlay.active { opacity: 1; visibility: visible; }

.modal {
  position: relative;
  width: 100%;
  max-width: 680px;
  max-height: 88vh;
  overflow-y: auto;
  padding: 0;
  background: linear-gradient(160deg, rgba(35, 20, 55, 0.98), rgba(20, 10, 35, 0.98));
  border: 2px solid rgba(236, 72, 153, 0.5);
  border-radius: 22px;
  box-shadow: 0 30px 90px rgba(0, 0, 0, 0.7),
              0 0 80px rgba(236, 72, 153, 0.3);
  transform: perspective(1200px) rotateX(-20deg) scale(0.85) translateY(30px);
  opacity: 0;
  transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s;
}
.modal-overlay.active .modal {
  transform: perspective(1200px) rotateX(0) scale(1) translateY(0);
  opacity: 1;
}
.modal::-webkit-scrollbar { width: 6px; }
.modal::-webkit-scrollbar-thumb {
  background: var(--gradient-warm);
  border-radius: 10px;
}

.modal-close {
  position: absolute;
  top: 14px; right: 14px;
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1px solid rgba(236, 72, 153, 0.5);
  background: rgba(20, 10, 35, 0.85);
  color: var(--text);
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.3s;
  display: grid;
  place-items: center;
  z-index: 20;
  backdrop-filter: blur(10px);
}
.modal-close:hover {
  background: var(--pink);
  transform: rotate(180deg) scale(1.1);
  box-shadow: 0 0 25px var(--pink);
}

/* Modal single image */
.modal-image {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 22px 22px 0 0;
  background: linear-gradient(135deg, #1a0f2e, #2a1a45);
  border-bottom: 1px solid rgba(236, 72, 153, 0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 5rem;
}
.modal-image::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(45deg,
      rgba(168, 85, 247, 0.06) 0 16px,
      rgba(236, 72, 153, 0.06) 16px 32px);
  z-index: 1;
}
.modal-image img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  z-index: 2;
}
.modal-image .modal-image-emoji {
  position: relative;
  z-index: 2;
  filter: drop-shadow(0 10px 28px rgba(0, 0, 0, 0.55));
}

/* Locked state on modal image */
.modal-image.locked img,
.modal-image.locked .modal-image-emoji {
  filter: blur(14px) brightness(0.35) saturate(1.5);
  transform: scale(1.08);
  transition: filter 0.4s;
}

.lock-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10;
  pointer-events: none;
}
.lock-icon {
  font-size: 3.5rem;
  filter: drop-shadow(0 0 20px var(--gold));
  margin-bottom: 8px;
}
.lock-text {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.2rem;
  font-weight: 900;
  letter-spacing: 5px;
  color: var(--gold);
  text-shadow: 0 0 20px var(--gold),
               0 0 40px rgba(212, 175, 55, 0.5);
  margin-bottom: 4px;
}
.lock-sub {
  font-size: 0.78rem;
  color: var(--text-dim);
  letter-spacing: 2px;
}

/* =========================================================
   MODAL CONTENT
   ========================================================= */
.modal-content {
  padding: 26px 32px 36px;
}

.modal-header {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  padding-bottom: 20px;
  border-bottom: 1px solid rgba(236, 72, 153, 0.15);
  margin-bottom: 20px;
}
.modal-icon-big {
  width: 72px;
  height: 72px;
  border-radius: 18px;
  background: var(--gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.4rem;
  flex-shrink: 0;
  box-shadow: 0 6px 25px rgba(236, 72, 153, 0.5),
              inset 0 -4px 0 rgba(0,0,0,0.2);
}
.modal-icon-big.live {
  background: var(--gradient-green);
  box-shadow: 0 6px 25px rgba(74, 222, 128, 0.5),
              inset 0 -4px 0 rgba(0,0,0,0.2);
}
.modal-title-wrap { flex: 1; min-width: 0; }
.modal-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.4rem;
  font-weight: 900;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
  background: var(--gradient-warm);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  line-height: 1.2;
}
.modal-dev {
  font-size: 0.78rem;
  color: var(--cyan);
  letter-spacing: 0.5px;
  text-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
  margin-bottom: 6px;
}
.modal-meta-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.modal-status {
  padding: 4px 12px;
  border-radius: 50px;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.5px;
  display: inline-flex;
  align-items: center;
}
.modal-status.stable {
  background: rgba(74, 222, 128, 0.15);
  border: 1px solid rgba(74, 222, 128, 0.5);
  color: var(--green);
}
.modal-status.beta {
  background: rgba(6, 182, 212, 0.15);
  border: 1px solid rgba(6, 182, 212, 0.5);
  color: var(--cyan);
}
.modal-status.soon {
  background: rgba(168, 85, 247, 0.15);
  border: 1px solid rgba(168, 85, 247, 0.5);
  color: #d8b4fe;
}
.modal-cat {
  font-size: 0.72rem;
  color: var(--text-dim);
  letter-spacing: 0.5px;
}

.modal-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  padding: 16px 0;
  margin-bottom: 20px;
  border-bottom: 1px solid rgba(236, 72, 153, 0.15);
}
.stat-item { text-align: center; }
.stat-label {
  font-size: 0.68rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
}
.stat-value {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--sakura);
  text-shadow: 0 0 10px rgba(232, 216, 255, 0.4);
}
.stat-value.accent {
  color: #f472b6;
  text-shadow: 0 0 12px rgba(244, 114, 182, 0.5);
}

.modal-section-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.95rem;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--cyan);
  margin: 22px 0 10px;
  text-shadow: 0 0 12px rgba(6, 182, 212, 0.5);
}

.modal-desc {
  color: var(--text-dim);
  line-height: 1.75;
  font-size: 0.94rem;
  margin-bottom: 8px;
}

.modal-features {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 8px;
}
.feature-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: rgba(236, 72, 153, 0.08);
  border: 1px solid rgba(236, 72, 153, 0.25);
  border-radius: 12px;
  font-size: 0.85rem;
  color: var(--text);
  transition: all 0.3s;
}
.feature-item:hover {
  background: rgba(236, 72, 153, 0.15);
  border-color: rgba(236, 72, 153, 0.5);
  transform: translateX(3px);
}
.feature-item .fi-emoji {
  font-size: 1.2rem;
  flex-shrink: 0;
}

.modal-tag-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}
.modal-tag {
  padding: 6px 14px;
  background: rgba(168, 85, 247, 0.12);
  border: 1px solid rgba(168, 85, 247, 0.35);
  border-radius: 50px;
  font-size: 0.78rem;
  color: #d8b4fe;
}

/* CTA locked */
.modal-cta {
  display: block;
  width: 100%;
  margin-top: 24px;
  padding: 16px;
  border-radius: 50px;
  border: 2px solid rgba(212, 175, 55, 0.5);
  background: rgba(212, 175, 55, 0.08);
  color: var(--gold);
  font-family: 'Orbitron', sans-serif;
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 3px;
  cursor: not-allowed;
  text-align: center;
  box-shadow: 0 0 25px rgba(212, 175, 55, 0.2),
              inset 0 0 15px rgba(212, 175, 55, 0.1);
  text-decoration: none;
}

/* CTA live */
.modal-cta.live {
  border: 2px solid transparent;
  background: var(--gradient-green);
  color: #062a1a;
  cursor: pointer;
  box-shadow: 0 0 30px rgba(74, 222, 128, 0.5),
              inset 0 -4px 0 rgba(0,0,0,0.15);
  transition: transform 0.3s, box-shadow 0.3s;
}
.modal-cta.live:hover {
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 0 50px rgba(74, 222, 128, 0.9),
              0 0 80px rgba(6, 182, 212, 0.5);
}

/* =========================================================
   FOOTER
   ========================================================= */
.footer {
  text-align: center;
  padding: 30px 20px;
  color: var(--text-dim);
  font-size: 0.8rem;
  border-top: 1px solid rgba(236, 72, 153, 0.15);
  letter-spacing: 1px;
}
.footer .jp {
  font-family: 'Yuji Syuku', serif;
  color: var(--sakura);
  letter-spacing: 4px;
  margin-bottom: 6px;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media (max-width: 640px) {
  body { padding-top: 62px; }
  .navbar { padding: 12px 4vw; }
  .logo { font-size: 1.1rem; }
  .back-btn { font-size: 0.8rem; padding: 6px 12px; }
  .hero-page { padding: 40px 5vw 16px; }
  .apps-wrap { padding: 10px 5vw 60px; }
  .apps-grid { grid-template-columns: 1fr; gap: 16px; }
  .filter-bar { padding: 18px 4vw; }
  .filter-btn { padding: 6px 14px; font-size: 0.78rem; }
  .modal-content { padding: 22px 20px 30px; }
  .modal-icon-big { width: 60px; height: 60px; font-size: 2rem; }
  .modal-title { font-size: 1.15rem; }
  .modal-features { grid-template-columns: 1fr; }
  .modal-stats { gap: 8px; padding: 12px 0; }
  .stat-value { font-size: 0.85rem; }
  .lock-icon { font-size: 2.5rem; }
  .lock-text { font-size: 1rem; letter-spacing: 4px; }
  .modal-image { font-size: 4rem; }
}
</style>
</head>
<body>

<div id="sakura"></div>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Kembali

<!-- HERO -->
<header class="hero-page">
  <span class="jp">アプリケーション</span>

  <p class="desc">
    Katalog produk digital yang sedang aku bangun. Beberapa sudah bisa diakses,
    sisanya masih terkunci sampai rilis resmi.

<!-- FILTER -->
<div class="filter-bar" id="filterBar">

  <button class="filter-btn" data-filter="stable">Stable</button>
  <button class="filter-btn" data-filter="beta">Beta</button>
  <button class="filter-btn" data-filter="soon">Soon</button>

<!-- APP GRID -->
<main class="apps-wrap">
  <div class="apps-grid" id="appsGrid"></div>
</main>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="closeModal()" aria-label="Tutup">✕</button>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- FOOTER -->
<footer class="footer">
  <p class="jp">ありがとう ございます</p>
  <p>© 2026 My Sinon — aplikasi.my-sinon.my.id — Made with 💜🌸</p>
</footer>

<script>
/* =========================================================
   DATA APLIKASI
   ---------------------------------------------------------
   - image: URL foto preview (null = pakai gradient fallback)
   - locked: true = preview diblur + ikon kunci
   - status: 'stable' | 'beta' | 'soon'
   ========================================================= */
const APPS = [
  /* STABLE */
  {
    id: 'warung-sinon',
    icon: '🏪',
    title: 'Warung Sinon',
    dev: 'My Sinon',
    category: 'E-Commerce',
    status: 'stable',
    locked: false,
    version: 'v0.6',
    platform: 'Web',
    access: 'Publik',
    link: 'https://warungsinon.my.id',
    image: 'img/WS.jpg',
    short: 'Warung digital dengan sistem order dan keranjang belanja untuk produk lokal.',
    desc: 'Warung Sinon adalah platform toko online yang dirancang untuk memudahkan UMKM dan penjual produk lokal dalam berjualan secara digital. Dilengkapi sistem order real-time, keranjang belanja, dan manajemen stok sederhana.',
    features: [
      { emoji: '🛒', text: 'Keranjang belanja interaktif' },
      { emoji: '📦', text: 'Manajemen produk & stok' },
      { emoji: '💳', text: 'Sistem pembayaran digital' },
      { emoji: '📊', text: 'Dashboard penjualan' },
      { emoji: '🔔', text: 'Notifikasi order real-time' },
      { emoji: '📱', text: 'Tampilan responsive mobile' }
    ],
    tech: ['Web App', 'E-Commerce', 'Realtime'],
    statusText: 'Tersedia untuk publik',
    statusLabel: 'Stable'
  },

  /* BETA */
  {
    id: 'sinoqi-nex',
    icon: '🤖',
    title: 'Sinoqi Nex',
    dev: 'My Sinon',
    category: 'AI Platform',
    status: 'beta',
    locked: false,
    version: 'v0.3-Nex',
    platform: 'Web',
    access: 'Publik',
    link: 'https://sinoqi-nex.vercel.app/',
    image: 'img/SI.jpg',
    short: 'Platform AI pribadi dengan chatbot pintar dan tools AI untuk produktivitas harian.',
    desc: 'Sinoqi Nex adalah platform berbasis AI yang menyediakan chatbot pintar, tools AI untuk membantu produktivitas, dan integrasi dengan berbagai layanan digital. Saat ini dalam tahap uji coba publik.',
    features: [
      { emoji: '💬', text: 'Chatbot pintar multi-bahasa' },
      { emoji: '🧠', text: 'Model AI terlatih custom' },
      { emoji: '⚡', text: 'Respon cepat & akurat' },
      { emoji: '🔌', text: 'API integrasi' },
      { emoji: '🎨', text: 'Generate gambar & teks' },
      { emoji: '📈', text: 'Analisis data otomatis' }
    ],
    tech: ['AI/ML', 'Python', 'API'],
    statusText: 'Tahap uji coba publik',
    statusLabel: 'Beta'
  },

  /* SOON */
  {
    id: 'geprek-nih',
    icon: '🍗',
    title: 'Geprek Nih',
    dev: 'My Sinon',
    category: 'Food & Beverage',
    status: 'soon',
    locked: true,
    version: 'v0.1.0',
    platform: 'Web',
    access: 'Terbatas',
    link: 'https://geprek.my-sinon.my.id',
    image: null,
    short: 'Aplikasi pemesanan geprek dan makanan pedas, order online dari perangkat.',
    desc: 'Geprek Nih adalah aplikasi pemesanan makanan (khususnya geprek dan menu pedas) yang memudahkan pelanggan untuk order langsung dari perangkat. Dilengkapi menu digital, keranjang, dan sistem pengiriman sederhana.',
    features: [
      { emoji: '🍗', text: 'Menu digital interaktif' },
      { emoji: '🛒', text: 'Order langsung dari perangkat' },
      { emoji: '🛵', text: 'Sistem delivery sederhana' },
      { emoji: '📍', text: 'Lokasi & tracking pesanan' },
      { emoji: '💳', text: 'Pembayaran digital' },
      { emoji: '⭐', text: 'Rating & review menu' }
    ],
    tech: ['Web App', 'F&B', 'Realtime'],
    statusText: 'Segera rilis',
    statusLabel: 'Soon'
  },
  {
    id: 'sinon-cloud',
    icon: '☁️',
    title: 'Sinon Cloud',
    dev: 'My Sinon',
    category: 'Cloud Service',
    status: 'soon',
    locked: true,
    version: 'v0.0.1',
    platform: 'Web',
    access: 'Terbatas',
    link: 'https://cloud.my-sinon.my.id',
    image: null,
    short: 'Layanan cloud storage dan hosting mini pribadi untuk eksperimen server sendiri.',
    desc: 'Sinon Cloud adalah proyek layanan cloud pribadi yang sedang dirancang. Berfungsi sebagai penyimpanan file, hosting mini, dan playground untuk eksperimen server dan infrastruktur.',
    features: [
      { emoji: '💾', text: 'Cloud storage pribadi' },
      { emoji: '🌐', text: 'Hosting mini untuk project' },
      { emoji: '🔐', text: 'Enkripsi & keamanan data' },
      { emoji: '⚙️', text: 'Panel admin sederhana' },
      { emoji: '📡', text: 'Akses dari mana saja' },
      { emoji: '🔧', text: 'API untuk developer' }
    ],
    tech: ['Cloud', 'Server', 'DevOps'],
    statusText: 'Segera rilis',
    statusLabel: 'Soon'
  }
];

/* =========================================================
   RENDER APP CARDS
   ========================================================= */
const grid = document.getElementById('appsGrid');

function renderApps(filter = 'all') {
  grid.innerHTML = '';
  const filtered = filter === 'all' ? APPS : APPS.filter(a => a.status === filter);

  if (filtered.length === 0) {
    grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-dim); padding: 40px;">Belum ada aplikasi di kategori ini.</p>';
    return;
  }

  filtered.forEach((a, i) => {
    const card = document.createElement('div');
    card.className = 'app-card ' + (a.locked ? 'is-locked' : 'is-live');
    card.style.animationDelay = (i * 0.1) + 's';
    card.dataset.id = a.id;

    const previewHTML = a.image
      ? `<img src="${a.image}" alt="${a.title}" loading="lazy" onerror="this.outerHTML='<span class=&quot;preview-emoji&quot;>${a.icon}</span>'">`
      : `<span class="preview-emoji">${a.icon}</span>`;

    card.innerHTML = `
      <div class="app-preview">
        ${previewHTML}
        ${a.locked ? '<div class="preview-lock">🔒</div>' : ''}
      </div>
      <div class="app-info">
        <div class="app-icon-big">${a.icon}</div>
        <div style="flex:1;min-width:0;">
          <div class="app-name">${a.title}</div>
          <div class="app-dev">${a.dev} / ${a.category}</div>
        </div>
      </div>
      <p class="app-short">${a.short}</p>
      <div class="app-bottom">
        <span class="app-status-badge ${a.status}">${a.statusLabel}</span>
        <span class="app-cta">${a.locked ? 'Lihat Detail' : 'Kunjungi'}</span>
      </div>
    `;

    card.addEventListener('click', () => openModal(a.id));
    grid.appendChild(card);
  });
}

/* =========================================================
   FILTER
   ========================================================= */
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderApps(btn.dataset.filter);
  });
});

/* =========================================================
   MODAL
   ========================================================= */
const overlay = document.getElementById('modalOverlay');
const modalBody = document.getElementById('modalBody');

function openModal(id) {
  const a = APPS.find(x => x.id === id);
  if (!a) return;

  const isLocked = a.locked === true;

  const imageHTML = a.image
    ? `<img src="${a.image}" alt="${a.title}" onerror="this.outerHTML='<span class=&quot;modal-image-emoji&quot;>${a.icon}</span>'">`
    : `<span class="modal-image-emoji">${a.icon}</span>`;

  const lockOverlayHTML = isLocked
    ? `<div class="lock-overlay">
         <div class="lock-icon">🔒</div>
         <div class="lock-text">LOCKED</div>
         <div class="lock-sub">${a.statusText}</div>
       </div>`
    : '';

  const ctaHTML = isLocked
    ? `<button class="modal-cta" disabled>BELUM RILIS</button>`
    : `<a class="modal-cta live" href="${a.link || '#'}" target="_blank" rel="noopener">BUKA APLIKASI</a>`;

  modalBody.innerHTML = `
    <div class="modal-image ${isLocked ? 'locked' : ''}">
      ${imageHTML}
      ${lockOverlayHTML}
    </div>

    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-icon-big ${a.locked === false ? 'live' : ''}">${a.icon}</div>
        <div class="modal-title-wrap">
          <div class="modal-title">${a.title}</div>
          <div class="modal-dev">${a.dev} / ${a.category}</div>
          <div class="modal-meta-row">
            <span class="modal-status ${a.status}">${a.statusLabel}</span>
          </div>
        </div>
      </div>

      <div class="modal-stats">
        <div class="stat-item">
          <div class="stat-label">Versi</div>
          <div class="stat-value">${a.version}</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Platform</div>
          <div class="stat-value">${a.platform}</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Akses</div>
          <div class="stat-value ${a.locked === false ? 'accent' : ''}">${a.access}</div>
        </div>
      </div>

      <h3 class="modal-section-title">Deskripsi</h3>
      <p class="modal-desc">${a.desc}</p>

      <h3 class="modal-section-title">Fitur Utama</h3>
      <div class="modal-features">
        ${a.features.map(f => `
          <div class="feature-item">
            <span class="fi-emoji">${f.emoji}</span>
            <span>${f.text}</span>
          </div>
        `).join('')}
      </div>

      <h3 class="modal-section-title">Teknologi</h3>
      <div class="modal-tag-list">
        ${a.tech.map(t => `<span class="modal-tag">${t}</span>`).join('')}
      </div>

      ${ctaHTML}
    </div>
  `;

  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  overlay.classList.remove('active');
  document.body.style.overflow = '';
}

overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

/* =========================================================
   SAKURA PETALS
   ========================================================= */
(function initSakura() {
  const container = document.getElementById('sakura');
  const isMobile = window.innerWidth < 768;
  const count = isMobile ? 10 : 20;

  for (let i = 0; i < count; i++) {
    const petal = document.createElement('div');
    petal.className = 'petal';
    petal.style.left = Math.random() * 100 + 'vw';
    petal.style.animationDuration = (12 + Math.random() * 8) + 's';
    petal.style.animationDelay = Math.random() * 12 + 's';
    petal.style.setProperty('--drift', (Math.random() * 120 - 40) + 'px');
    petal.style.transform = `rotate(${Math.random() * 360}deg)`;
    if (Math.random() > 0.5) {
      petal.style.background = 'radial-gradient(circle at 30% 30%, #e0d0ff, #a855f7)';
    }
    container.appendChild(petal);
  }
})();

/* =========================================================
   INIT
   ========================================================= */
renderApps('all');
</script>
</body>
</html>
